# MongoDB root credentials. Demo values only - change them for anything real.
# Kubernetes stores these base64-encoded. To read one back:
#   kubectl get secret mongodb-secret -o jsonpath='{.data.mongo-root-password}' | base64 -d
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
type: Opaque
stringData:
  mongo-root-username: admin
  mongo-root-password: EksDemo2026pass
