# Demo web app that reads and writes MongoDB: a "User profile" page.
# Click "Edit Profile", change the name/email/interests, click "Update Profile":
# the change is saved in MongoDB (database my-db, collection users).
#
# Image: nanajanashia/k8s-demo-app:v1.0 (Node.js + Express, port 3000), the public demo
# app from the "TechWorld with Nana" Kubernetes tutorial this topic is based on.
#   Docker Hub: https://hub.docker.com/r/nanajanashia/k8s-demo-app
# It builds its connection string from three env vars:
#   mongodb://USER_NAME:USER_PWD@DB_URL     (port 27017 by default)
# Here they come from mongodb-secret (user, password) and mongodb-configmap (host).
# Demo only: the page has no login, and the image is from 2021 (Node 13).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  labels:
    app: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: webapp
          image: nanajanashia/k8s-demo-app:v1.0
          ports:
            - containerPort: 3000
          env:
            - name: USER_NAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: mongo-root-username
            - name: USER_PWD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: mongo-root-password
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: mongodb-configmap
                  key: database_url
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
---
# Public load balancer: http://<hostname> (port 80) -> app port 3000
apiVersion: v1
kind: Service
metadata:
  name: webapp-service
spec:
  type: LoadBalancer
  selector:
    app: webapp
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
